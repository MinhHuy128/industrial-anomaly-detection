# Configuration for Pairwise VLM Ranking & Gated Adapter Experiments on MVTec LOCO AD

project:
  name: "ViTill_GCT_VLM_Ranking"
  seed: 42
  device: "cuda"

dataset:
  name: "mvtec_loco"
  data_path: "data/mvtec_loco"
  vlm_cache_path: "data/vlm_cache"
  img_size: 448
  crop_size: 392
  categories:
    - "pushpins"
    - "screw_bag"
    - "breakfast_box"
    - "juice_bottle"
    - "splicing_connectors"

train:
  total_iters: 5000
  batch_size: 4
  accum_steps: 4
  use_amp: false
  learning_rate: 0.002
  final_lr: 0.0002
  warmup_iters: 100
  weight_decay: 0.0001
  gct_lambda: 0.5
  rank_lambda: 0.05
  rank_margin: 0.10
  hm_p: 0.9
  hm_factor: 0.1
  save_dir: "experiments"
  log_interval: 100
  save_interval: 1000

model:
  backbone: "dinov2reg_vit_base_14"
  embed_dim: 768
  vlm_dim: 512
  num_heads: 12
  decoder_layers: 8
  bottleneck_drop: 0.2
  target_layers: [2, 3, 4, 5, 6, 7, 8, 9]
  fuse_layer_encoder: [[0, 1, 2, 3], [4, 5, 6, 7]]
  fuse_layer_decoder: [[0, 1, 2, 3], [4, 5, 6, 7]]

ablation:
  # Modes: gct_baseline, gct_ranking, gct_adapter, gct_adapter_modulation, gct_adapter_modulation_ranking
  mode: "gct_ranking"
  init_gamma: -4.0 # Initial sigmoid gate value = sigmoid(-4.0) ~ 0.018

eval:
  metrics: ["auroc_logical", "auroc_structural", "auroc_mean", "spro_pixel"]
  anomaly_score: "cosine_distance_dual_stream"
  gct_gamma: 1.0
  top_ratio: 0.01
  gaussian_sigma: 4
